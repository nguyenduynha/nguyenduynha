<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Sun Sunset Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Moving Grid Gradient -->
    <linearGradient id="gridGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d946ef" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Progress Bar Gradient (Animated) -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#d946ef;#10b981;#00f0ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#d946ef">
        <animate attributeName="stop-color" values="#d946ef;#10b981;#00f0ff;#d946ef" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#00f0ff;#d946ef;#10b981" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Holographic Laser Shimmer -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-900,0" to="900,0" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00f0ff" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>

    <filter id="neonPink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.8"/>
    </filter>

    <!-- Sun Slices Mask -->
    <mask id="sunMask">
      <circle cx="750" cy="145" r="72" fill="#fff"/>
      <rect x="660" y="112" width="180" height="3" fill="#000"/>
      <rect x="660" y="122" width="180" height="4" fill="#000"/>
      <rect x="660" y="133" width="180" height="6" fill="#000"/>
      <rect x="660" y="147" width="180" height="8" fill="#000"/>
      <rect x="660" y="164" width="180" height="11" fill="#000"/>
      <rect x="660" y="184" width="180" height="14" fill="#000"/>
    </mask>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Share+Tech+Mono&amp;display=swap');
      
      .title { 
        font-family: 'Orbitron', monospace, sans-serif; 
        font-size: 42px; 
        font-weight: 900; 
        letter-spacing: 5px; 
        fill: #ffffff; 
        animation: textPulse 3s ease-in-out infinite alternate;
      }
      .sub { 
        font-family: 'Orbitron', monospace; 
        font-size: 15px; 
        font-weight: 700; 
        letter-spacing: 3px; 
        fill: #00f0ff; 
      }
      .tags { 
        font-family: 'Share Tech Mono', monospace; 
        font-size: 13px; 
        letter-spacing: 2px; 
        fill: #ec4899; 
        font-weight: 600; 
      }
      .meta { 
        font-family: 'Share Tech Mono', monospace; 
        font-size: 11px; 
        letter-spacing: 1.5px; 
        fill: #94a3b8; 
      }
      .bar-text { 
        font-family: 'Share Tech Mono', monospace; 
        font-size: 10px; 
        letter-spacing: 1px; 
        fill: #94a3b8; 
      }

      /* Animations */
      @keyframes textPulse {
        0% { filter: drop-shadow(0 0 5px #00f0ff); fill: #f8fafc; }
        50% { filter: drop-shadow(0 0 15px #00f0ff) drop-shadow(0 0 25px #00f0ff); fill: #ffffff; }
        100% { filter: drop-shadow(0 0 5px #00f0ff); fill: #f8fafc; }
      }

      @keyframes radarBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }

      .blink-dot {
        animation: radarBlink 1.5s infinite ease-in-out;
        transform-origin: 65px 44px;
      }

      @keyframes scanGrid {
        0% { transform: translateY(0); }
        100% { transform: translateY(24px); }
      }

      .moving-grid-lines {
        animation: scanGrid 1.2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base (Cyber Dark Mode) -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Sliced Retro Sun with Pulse -->
  <g>
    <circle cx="750" cy="145" r="75" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="74;78;74" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="145" r="72" fill="url(#sunGrad)" mask="url(#sunMask)"/>
  </g>

  <!-- Synthwave Perspective Wireframe Grid with Motion Animation -->
  <g opacity="0.8">
    <!-- Clip path to keep grid below horizon -->
    <clipPath id="gridClip">
      <rect x="0" y="150" width="900" height="90"/>
    </clipPath>
    
    <g clip-path="url(#gridClip)">
      <!-- Animated Horizontal Moving Lines -->
      <g class="moving-grid-lines">
        <line x1="0" y1="130" x2="900" y2="130" stroke="url(#gridGrad)" stroke-width="1"/>
        <line x1="0" y1="154" x2="900" y2="154" stroke="url(#gridGrad)" stroke-width="1.2"/>
        <line x1="0" y1="178" x2="900" y2="178" stroke="url(#gridGrad)" stroke-width="1.5"/>
        <line x1="0" y1="202" x2="900" y2="202" stroke="url(#gridGrad)" stroke-width="1.8"/>
        <line x1="0" y1="226" x2="900" y2="226" stroke="url(#gridGrad)" stroke-width="2.2"/>
        <line x1="0" y1="250" x2="900" y2="250" stroke="url(#gridGrad)" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Horizon Line -->
    <line x1="20" y1="150" x2="880" y2="150" stroke="#00f0ff" stroke-width="1" opacity="0.7"/>

    <!-- Perspective rays converging to vanishing point (520, 150) -->
    <line x1="520" y1="150" x2="-100" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="520" y1="150" x2="80" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="520" y1="150" x2="230" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="520" y1="150" x2="380" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="520" y1="150" x2="520" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="520" y1="150" x2="660" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="520" y1="150" x2="800" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="520" y1="150" x2="950" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
  </g>

  <!-- Cyberpunk Frame Corners [ ... ] with Neon Glow -->
  <g stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#neonCyan)">
    <!-- Top Left -->
    <path d="M 45 40 L 30 40 L 30 70"/>
    <!-- Top Right -->
    <path d="M 855 40 L 870 40 L 870 70"/>
    <!-- Bottom Left -->
    <path d="M 45 210 L 30 210 L 30 180"/>
    <!-- Bottom Right -->
    <path d="M 855 210 L 870 210 L 870 180"/>
  </g>

  <!-- Top Metadata Bar -->
  <g class="meta">
    <text x="50" y="47">[ <tspan fill="#10b981" class="blink-dot">● ONLINE</tspan> ]</text>
    <text x="850" y="47" text-anchor="end">LOC: VIET NAM · UTC+7 · DUY NHAT</text>
  </g>

  <!-- Main Center Header with Neon Glowing Animation -->
  <g transform="translate(60, 0)">
    <!-- Glowing Animated Name -->
    <text x="0" y="105" class="title">DUYNHAT</text>
    
    <!-- Animated Subtitle -->
    <text x="3" y="132" class="sub" filter="url(#neonCyan)">// SYSTEM ONLINE</text>

    <!-- Roles & Tags -->
    <text x="3" y="153" class="tags" filter="url(#neonPink)">CREATIVE DEVELOPER · UI/UX DESIGNER · FRONTEND ENGINEER</text>
  </g>

  <!-- Bottom Boot Sequence & Dynamic Stats Bar -->
  <g transform="translate(48, 192)">
    <text x="0" y="0" class="bar-text">BOOT SEQUENCE</text>
    
    <!-- Progress Bar Track -->
    <rect x="100" y="-8" width="220" height="8" rx="4" fill="#1e293b"/>
    <!-- Progress Bar Fill with Color Cycling Animation -->
    <rect x="100" y="-8" width="220" height="8" rx="4" fill="url(#barGrad)"/>
    
    <!-- Pulsing Ready Indicator -->
    <text x="330" y="0" class="bar-text" fill="#10b981" font-weight="bold">100% · READY_
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite" />
    </text>

    <!-- Stats on the Right -->
    <text x="802" y="0" class="bar-text" text-anchor="end">STREAK 40D · 3.8K CONTRIB · 107 REPOS · SYNC 2026-11-02</text>
  </g>

  <!-- Holographic Laser Shimmer Effect Sweeping Across Entire Banner -->
  <rect x="0" y="0" width="900" height="240" rx="12" fill="url(#shimmer)" pointer-events="none"/>
</svg>

