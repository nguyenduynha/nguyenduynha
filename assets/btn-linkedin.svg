<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 36" width="128" height="36">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071224"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <!-- Cyber chamfered border -->
  <polygon points="10,1 118,1 127,10 127,26 118,35 10,35 1,26 1,10" fill="url(#bg)" stroke="#00f0ff" stroke-width="1.4"/>
  <!-- LinkedIn Icon -->
  <g transform="translate(14, 10)">
    <rect width="16" height="16" rx="2" fill="#0077b5"/>
    <text x="8" y="12" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>
  </g>
  <!-- Text -->
  <text x="40" y="23" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="1.2">LINKEDIN</text>
</svg>
