<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 85" width="100%" height="100%">
  <defs>
    <!-- Background card gradient -->
    <linearGradient id="cardSpiderBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <!-- Sparkline Gradients -->
    <linearGradient id="waveRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e62429" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e62429" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="waveStarkBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0077fe" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="waveSpiderCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="wavePurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.0"/>
    </linearGradient>

    <style>
      .tele-txt { font-family: 'Share Tech Mono', 'Courier New', monospace; }
      .num-val { font-family: 'Share Tech Mono', monospace; font-weight: bold; font-size: 16px; }
      .lbl-val { font-family: 'Share Tech Mono', monospace; font-size: 8px; fill: #64748b; letter-spacing: 0.5px; }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 2.5; }
        50% { opacity: 0.4; r: 1.8; }
      }
      .dot-anim { animation: pulseDot 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- CARD 1: MARVEL RED (WEB-FLUID 98%) -->
  <g transform="translate(0, 0)">
    <rect width="128" height="85" rx="6" fill="url(#cardSpiderBg)" stroke="#e62429" stroke-width="1.2"/>
    <text x="10" y="18" class="lbl-val" fill="#ff4455">WEB.FLUID</text>
    <text x="118" y="20" class="num-val" fill="#ff3344" text-anchor="end">98%<tspan font-size="10" fill="#00f0ff">▲</tspan></text>
    <!-- Waveform Area & Stroke -->
    <path d="M 10 65 Q 25 55, 40 60 T 70 45 T 95 50 T 118 42 L 118 70 L 10 70 Z" fill="url(#waveRed)"/>
    <path d="M 10 65 Q 25 55, 40 60 T 70 45 T 95 50 T 118 42" fill="none" stroke="#e62429" stroke-width="1.6"/>
    <circle cx="118" cy="42" r="2.5" fill="#ff3344" class="dot-anim"/>
    <text x="10" y="78" class="lbl-val">PRESSURE &gt;&gt;</text>
    <text x="118" y="78" class="lbl-val" text-anchor="end">OPTIMAL</text>
  </g>

  <!-- CARD 2: STARK BLUE (COMMITS 173) -->
  <g transform="translate(137, 0)">
    <rect width="128" height="85" rx="6" fill="url(#cardSpiderBg)" stroke="#0077fe" stroke-width="1.2"/>
    <text x="10" y="18" class="lbl-val" fill="#38bdf8">COMMITS</text>
    <text x="118" y="20" class="num-val" fill="#38bdf8" text-anchor="end">173</text>
    <path d="M 10 66 Q 28 62, 45 48 T 80 52 T 102 38 T 118 44 L 118 70 L 10 70 Z" fill="url(#waveStarkBlue)"/>
    <path d="M 10 66 Q 28 62, 45 48 T 80 52 T 102 38 T 118 44" fill="none" stroke="#0077fe" stroke-width="1.6"/>
    <circle cx="118" cy="44" r="2.5" fill="#38bdf8" class="dot-anim"/>
    <text x="10" y="78" class="lbl-val">ACTIVITY</text>
    <text x="118" y="78" class="lbl-val" text-anchor="end">S0041</text>
  </g>

  <!-- CARD 3: CYAN (AGILITY 113) -->
  <g transform="translate(274, 0)">
    <rect width="128" height="85" rx="6" fill="url(#cardSpiderBg)" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="10" y="18" class="lbl-val" fill="#00f0ff">AGILITY</text>
    <text x="118" y="20" class="num-val" fill="#00f0ff" text-anchor="end">113</text>
    <path d="M 10 62 Q 25 68, 50 56 T 80 48 T 100 58 T 118 46 L 118 70 L 10 70 Z" fill="url(#waveSpiderCyan)"/>
    <path d="M 10 62 Q 25 68, 50 56 T 80 48 T 100 58 T 118 46" fill="none" stroke="#00f0ff" stroke-width="1.6"/>
    <circle cx="118" cy="46" r="2.5" fill="#00f0ff" class="dot-anim"/>
    <text x="10" y="78" class="lbl-val">PULL.REQ</text>
    <text x="118" y="78" class="lbl-val" text-anchor="end">SYNCED</text>
  </g>

  <!-- CARD 4: PURPLE (PROJECTS 18) -->
  <g transform="translate(411, 0)">
    <rect width="128" height="85" rx="6" fill="url(#cardSpiderBg)" stroke="#d946ef" stroke-width="1.2"/>
    <text x="10" y="18" class="lbl-val" fill="#d946ef">PROJECTS</text>
    <text x="118" y="20" class="num-val" fill="#d946ef" text-anchor="end">18<tspan font-size="10" fill="#f472b6">★</tspan></text>
    <!-- Peak spike wave -->
    <path d="M 10 68 Q 35 68, 60 66 T 85 36 T 102 62 T 118 64 L 118 70 L 10 70 Z" fill="url(#wavePurple)"/>
    <path d="M 10 68 Q 35 68, 60 66 T 85 36 T 102 62 T 118 64" fill="none" stroke="#d946ef" stroke-width="1.6"/>
    <circle cx="85" cy="36" r="2.5" fill="#f472b6" class="dot-anim"/>
    <text x="10" y="78" class="lbl-val">RELEASE</text>
    <text x="118" y="78" class="lbl-val" text-anchor="end">STARK.V2</text>
  </g>
</svg>
