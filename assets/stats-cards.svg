<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Dark Card Background -->
    <linearGradient id="statsCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#02050b"/>
    </linearGradient>

    <!-- Sparkline green gradient -->
    <linearGradient id="statGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <style>
      .stat-title { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 9.5px; font-weight: bold; letter-spacing: 1.2px; }
      .stat-meta { font-family: 'Share Tech Mono', monospace; font-size: 8px; fill: #64748b; }
      .stat-num { font-family: 'Share Tech Mono', monospace; font-weight: bold; font-size: 15px; }

      @keyframes circlePulse {
        0%, 100% { filter: drop-shadow(0 0 3px #10b981); }
        50% { filter: drop-shadow(0 0 8px #10b981); }
      }
      .gauge-pulse { animation: circlePulse 2.5s ease-in-out infinite; }

      @keyframes barPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.6; }
      }
      .pulse-bar { animation: barPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ==================== CARD 1: GITHUB STATS ==================== -->
  <g transform="translate(0, 0)">
    <rect width="170" height="120" rx="6" fill="url(#statsCardBg)" stroke="#10b981" stroke-width="1.2"/>
    <text x="12" y="20" class="stat-title" fill="#10b981">GITHUB STATS</text>

    <!-- Sparkline activity curve in card 1 -->
    <path d="M 12 70 Q 28 85, 45 65 T 75 75 T 100 52 L 100 85 L 12 85 Z" fill="url(#statGreen)"/>
    <path d="M 12 70 Q 28 85, 45 65 T 75 75 T 100 52" fill="none" stroke="#10b981" stroke-width="1.6"/>

    <!-- Circular Gauge with 97 score -->
    <g transform="translate(132, 60)" class="gauge-pulse">
      <circle cx="0" cy="0" r="22" fill="#030814" stroke="#1e293b" stroke-width="3"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="120 138" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="5" font-family="'Share Tech Mono', monospace" font-size="14" font-weight="900" fill="#10b981" text-anchor="middle">97</text>
    </g>

    <text x="12" y="105" class="stat-meta">GRADE: <tspan fill="#10b981" font-weight="bold">A+ OPTIMAL</tspan></text>
  </g>

  <!-- ==================== CARD 2: TOP LANGUAGES ==================== -->
  <g transform="translate(178, 0)">
    <rect width="184" height="120" rx="6" fill="url(#statsCardBg)" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="12" y="20" class="stat-title" fill="#00f0ff">TOP LANGUAGES</text>

    <!-- Bar Chart -->
    <g transform="translate(12, 34)">
      <!-- Bar 1: TypeScript (Cyan) -->
      <rect x="0" y="20" width="10" height="36" rx="2" fill="#00f0ff" class="pulse-bar"/>
      <!-- Bar 2: JavaScript (Yellow) -->
      <rect x="16" y="28" width="10" height="28" rx="2" fill="#facc15"/>
      <!-- Bar 3: Python (Blue) -->
      <rect x="32" y="36" width="10" height="20" rx="2" fill="#3b82f6"/>
      <!-- Bar 4: HTML/CSS (Orange) -->
      <rect x="48" y="42" width="10" height="14" rx="2" fill="#f97316"/>
      <!-- Bar 5: Vue (Emerald) -->
      <rect x="64" y="46" width="10" height="10" rx="2" fill="#10b981"/>
      <!-- Bar 6: Others (Purple) -->
      <rect x="80" y="50" width="10" height="6" rx="2" fill="#a855f7"/>
      <!-- Axis line -->
      <line x1="0" y1="58" x2="94" y2="58" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Legend & Labels -->
    <g transform="translate(112, 34)">
      <circle cx="4" cy="10" r="3" fill="#00f0ff"/>
      <text x="12" y="13" class="stat-meta">TypeScript</text>

      <circle cx="4" cy="24" r="3" fill="#facc15"/>
      <text x="12" y="27" class="stat-meta">JavaScript</text>

      <circle cx="4" cy="38" r="3" fill="#3b82f6"/>
      <text x="12" y="41" class="stat-meta">Python</text>

      <circle cx="4" cy="52" r="3" fill="#10b981"/>
      <text x="12" y="55" class="stat-meta">Vue / CSS</text>
    </g>

    <text x="12" y="105" class="stat-meta">LANGUAGES: <tspan fill="#00f0ff">7 ACTIVE</tspan></text>
  </g>

  <!-- ==================== CARD 3: COMMIT STREAK ==================== -->
  <g transform="translate(370, 0)">
    <rect width="170" height="120" rx="6" fill="url(#statsCardBg)" stroke="#d946ef" stroke-width="1.2"/>
    <text x="12" y="20" class="stat-title" fill="#d946ef">COMMIT STREAK</text>

    <!-- Streak Flame & Ring -->
    <g transform="translate(136, 42)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="75 95"/>
      <!-- Flame icon -->
      <path d="M 0 -8 C 3 -4, 6 -1, 4 4 C 3 7, -3 7, -4 4 C -6 0, -2 -3, 0 -8 Z" fill="#f59e0b"/>
    </g>

    <!-- Metrics -->
    <g transform="translate(12, 36)">
      <text x="0" y="16" class="stat-num" fill="#f8fafc">3.92k <tspan font-size="9" fill="#f59e0b">STARS</tspan></text>
      <text x="0" y="36" class="stat-num" fill="#00f0ff">2.45k <tspan font-size="9" fill="#94a3b8">CONTRIBS</tspan></text>
      <text x="0" y="56" class="stat-num" fill="#ec4899">107 <tspan font-size="9" fill="#94a3b8">REPOS</tspan></text>
    </g>

    <text x="12" y="105" class="stat-meta">CURRENT: <tspan fill="#f59e0b" font-weight="bold">48 DAYS 🔥</tspan></text>
  </g>
</svg>
