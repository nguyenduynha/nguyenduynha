<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 235" width="100%" height="100%">
  <defs>
    <linearGradient id="whoamiSpiderBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>

    <!-- Web Texture Pattern -->
    <pattern id="cardWebPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 40 40 M 40 0 L 0 40" stroke="#e62429" stroke-width="0.3" opacity="0.12"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="#e62429" stroke-width="0.3" opacity="0.1"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bangers&amp;family=Share+Tech+Mono&amp;display=swap');

      .mono-txt { font-family: 'Share Tech Mono', 'Courier New', monospace; }
      .pill-txt { font-family: 'Share Tech Mono', monospace; font-size: 8.5px; font-weight: bold; }
      .desc-txt { font-family: 'Share Tech Mono', -apple-system, sans-serif; font-size: 9.5px; fill: #cbd5e1; }
      .spec-lbl { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #64748b; }
      .spec-val { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #e62429; font-weight: bold; }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .blink { animation: pulseDot 1.6s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="540" height="235" rx="8" fill="url(#whoamiSpiderBg)" stroke="#381928" stroke-width="1.4"/>
  <rect width="540" height="235" rx="8" fill="url(#cardWebPattern)"/>

  <!-- ==================== TITLE & TERMINAL ==================== -->
  <g transform="translate(18, 24)">
    <text x="0" y="0" font-family="'Bangers', cursive, sans-serif" font-size="18" fill="#ffffff" letter-spacing="1.5">
      <tspan fill="#e62429">&gt;</tspan> WHOAMI <tspan font-family="'Share Tech Mono', monospace" font-size="11" fill="#94a3b8">(SPIDER-IDENTITY)</tspan>
    </text>
    <text x="504" y="-2" font-family="'Share Tech Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="end">EARTH-616</text>
  </g>

  <!-- ==================== BADGE PILLS ROW ==================== -->
  <g transform="translate(18, 38)">
    <!-- Pill 1: Web-Slinger -->
    <g transform="translate(0, 0)">
      <rect width="76" height="18" rx="9" fill="#2d0a14" stroke="#e62429" stroke-width="1"/>
      <text x="38" y="12" class="pill-txt" fill="#ff4455" text-anchor="middle">web-slinger</text>
    </g>

    <!-- Pill 2: Stark-Tech -->
    <g transform="translate(81, 0)">
      <rect width="68" height="18" rx="9" fill="#061e38" stroke="#0077fe" stroke-width="1"/>
      <text x="34" y="12" class="pill-txt" fill="#38bdf8" text-anchor="middle">stark-tech</text>
    </g>

    <!-- Pill 3: Spider-Verse -->
    <g transform="translate(154, 0)">
      <rect width="78" height="18" rx="9" fill="#181229" stroke="#a855f7" stroke-width="1"/>
      <text x="39" y="12" class="pill-txt" fill="#c084fc" text-anchor="middle">spider-verse</text>
    </g>

    <!-- Pill 4: React -->
    <g transform="translate(237, 0)">
      <rect width="52" height="18" rx="9" fill="#04202c" stroke="#00f0ff" stroke-width="1"/>
      <text x="26" y="12" class="pill-txt" fill="#00f0ff" text-anchor="middle">react</text>
    </g>

    <!-- Pill 5: Next.js -->
    <g transform="translate(294, 0)">
      <rect width="58" height="18" rx="9" fill="#18181b" stroke="#ffffff" stroke-width="0.8"/>
      <text x="29" y="12" class="pill-txt" fill="#ffffff" text-anchor="middle">next.js</text>
    </g>

    <!-- Pill 6: Trends.dev -->
    <g transform="translate(357, 0)">
      <rect width="66" height="18" rx="9" fill="#062220" stroke="#10b981" stroke-width="1"/>
      <text x="33" y="12" class="pill-txt" fill="#10b981" text-anchor="middle">trends.dev</text>
    </g>
  </g>

  <!-- ==================== DESCRIPTION QUOTE BOX ==================== -->
  <g transform="translate(18, 70)">
    <rect width="504" height="48" rx="4" fill="#070c17" stroke="#2a1827" stroke-width="1"/>
    <!-- Left Accent Bar -->
    <rect x="0" y="0" width="3.5" height="48" rx="1.5" fill="#e62429"/>
    <!-- Quote text -->
    <text x="14" y="20" class="desc-txt">"With great coding power comes great UI responsibility."</text>
    <text x="14" y="36" class="desc-txt" fill="#94a3b8">Creative Web Developer passionate about high-performance modern web apps and Spider-Verse UI.</text>
  </g>

  <!-- ==================== TERMINAL SPEC SPECIFICATIONS ==================== -->
  <g transform="translate(18, 134)">
    <rect width="504" height="86" rx="4" fill="#040712" stroke="#1c1d2e" stroke-width="1"/>

    <!-- Row 1: alias -->
    <text x="16" y="20" class="spec-lbl">alias: <tspan class="spec-val" fill="#f8fafc">duynhat</tspan></text>

    <!-- Row 2: role -->
    <text x="16" y="36" class="spec-lbl">role: <tspan class="spec-val" fill="#ff4455">Creative Web Developer</tspan></text>

    <!-- Row 3: specialization -->
    <text x="16" y="52" class="spec-lbl">specialization: <tspan class="spec-val" fill="#0077fe">Creative Web Developer / Spider-Verse UI</tspan></text>

    <!-- Row 4: location & status -->
    <text x="16" y="68" class="spec-lbl">universe: <tspan class="spec-val" fill="#a855f7">Earth-616 / Viet Nam</tspan></text>
    
    <text x="310" y="68" class="spec-lbl">status: <tspan class="spec-val" fill="#00f0ff">web-slinging active</tspan></text>
    <circle cx="300" cy="65" r="3" fill="#00f0ff" class="blink"/>
  </g>
</svg>
