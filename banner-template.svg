<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>

    <!-- Sun Sunset Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Grid Line Gradient -->
    <linearGradient id="gridGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>

    <!-- Sun Slices Mask -->
    <mask id="sunMask">
      <circle cx="750" cy="150" r="75" fill="#fff"/>
      <!-- horizontal cuts -->
      <rect x="660" y="115" width="180" height="4" fill="#000"/>
      <rect x="660" y="125" width="180" height="5" fill="#000"/>
      <rect x="660" y="137" width="180" height="7" fill="#000"/>
      <rect x="660" y="152" width="180" height="9" fill="#000"/>
      <rect x="660" y="170" width="180" height="12" fill="#000"/>
      <rect x="660" y="192" width="180" height="15" fill="#000"/>
    </mask>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Share+Tech+Mono&amp;display=swap');
      .title { font-family: 'Orbitron', -apple-system, sans-serif; font-size: 42px; font-weight: 900; letter-spacing: 4px; fill: #0f172a; }
      .sub { font-family: 'Orbitron', monospace; font-size: 16px; font-weight: 700; letter-spacing: 3px; fill: #0284c7; }
      .tags { font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 2px; fill: #db2777; font-weight: 600; }
      .meta { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 1.5px; fill: #64748b; }
      .bar-text { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1px; fill: #475569; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Synthwave Perspective Wireframe Grid -->
  <g opacity="0.65">
    <!-- Horizon Line -->
    <line x1="30" y1="155" x2="870" y2="155" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="30" y1="168" x2="870" y2="168" stroke="url(#gridGrad)" stroke-width="1"/>
    <line x1="30" y1="184" x2="870" y2="184" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="30" y1="204" x2="870" y2="204" stroke="url(#gridGrad)" stroke-width="1.5"/>
    <line x1="30" y1="228" x2="870" y2="228" stroke="url(#gridGrad)" stroke-width="1.8"/>

    <!-- Perspective rays converging to vanishing point (550, 155) -->
    <line x1="550" y1="155" x2="-50" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="550" y1="155" x2="100" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="550" y1="155" x2="250" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="550" y1="155" x2="400" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="550" y1="155" x2="550" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="550" y1="155" x2="700" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="550" y1="155" x2="850" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
    <line x1="550" y1="155" x2="1000" y2="240" stroke="url(#gridGrad)" stroke-width="1.2"/>
  </g>

  <!-- Synthwave Sliced Sun -->
  <circle cx="750" cy="150" r="75" fill="url(#sunGrad)" mask="url(#sunMask)"/>

  <!-- Cyberpunk Frame Corners [ ... ] -->
  <!-- Top Left -->
  <path d="M 45 42 L 30 42 L 30 75" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top Right -->
  <path d="M 855 42 L 870 42 L 870 75" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Left -->
  <path d="M 45 208 L 30 208 L 30 175" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Right -->
  <path d="M 855 208 L 870 208 L 870 175" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g class="meta">
    <text x="50" y="47">[ <tspan fill="#10b981">● ONLINE</tspan> ]</text>
    <text x="850" y="47" text-anchor="end">LOC: VIET NAM · UTC+7 · DUO TECH</text>
  </g>

  <!-- Main Center Header -->
  <g transform="translate(60, 0)">
    <!-- Main Big Name with Neon Cyan Drop Shadow -->
    <text x="0" y="105" class="title" filter="url(#cyanGlow)">NGUYEN DUY NHAT</text>
    
    <!-- System Status Subtitle -->
    <text x="3" y="132" class="sub">// SYSTEM ONLINE</text>

    <!-- Roles & Tags -->
    <text x="3" y="153" class="tags">CREATIVE DEVELOPER · UI/UX DESIGNER · FRONTEND ENGINEER</text>
  </g>

  <!-- Bottom Boot Sequence & Stats Bar -->
  <g transform="translate(48, 190)">
    <text x="0" y="0" class="bar-text">BOOT SEQUENCE</text>
    
    <!-- Progress Bar Track -->
    <rect x="100" y="-8" width="220" height="8" rx="4" fill="#e2e8f0"/>
    <!-- Progress Bar Fill (100% READY) -->
    <rect x="100" y="-8" width="220" height="8" rx="4" fill="url(#barGrad)"/>
    
    <text x="330" y="0" class="bar-text" fill="#10b981" font-weight="bold">100% · READY_</text>

    <!-- Real Stats on the Right -->
    <text x="802" y="0" class="bar-text" text-anchor="end">STREAK 40D · 3.8K CONTRIB / 12MO · 107 REPOS · SYNC 2026-11-01</text>
  </g>
</svg>

